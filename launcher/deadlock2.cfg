# deadlock2.cfg - settings for launch.cmd / Launcher.cs
#
# The game itself has no resolution setting: 640x480 is hard-coded in DEADLOCK.EXE.
# The launcher starts the game suspended, rewrites those constants in memory to the
# values below, and resumes it. DEADLOCK.EXE on disk is never modified.
#
# resolution  WIDTHxHEIGHT. Anything the DirectDraw wrapper / your display accepts.
#             640x480 = unmodified game. Minimum 640x480 (the UI needs that much).
# windowed    0 = exclusive full screen: SetDisplayMode(resolution) is really called and the
#                 GOG wrapper scales that surface to the desktop with 4:3 bars. Use this.
#             1 = windowed (passes -w, no display-mode change). With the GOG ddraw wrapper this
#                 gives a desktop-sized borderless window in which only the 640x480 part of the
#                 drawing is stretched to fill it, so the extra area is never visible. Only
#                 useful for debugging or without the wrapper.
# bpp         8 or 16 bits per pixel (passes -8 / -16). 16 avoids palette problems.
# exe         path to DEADLOCK.EXE. Default: next to this file, then the current folder,
#             then the GOG registry path.
# args        extra command-line arguments for the game (e.g. -nosound).
#
# viewport    WIDTHxHEIGHT of the map window. Default: resolution minus 40x80 (the 640x480
#             game uses 600x400). Normally leave it out.
#
# Experimental: with a resolution other than 640x480 the game runs, menus and dialogs work,
# and the map renders across the whole new width, but every panel, the HUD and the frame art
# are still the 640x480 sprites at their old positions and nothing paints the area to their
# right and below them. See Resolution-Investigation.md for what it looks like and what is
# left to do.

resolution=1024x768
windowed=0
bpp=16
#exe=C:\Games\Deadlock2\DEADLOCK.EXE
#args=
