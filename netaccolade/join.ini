; Deadlock II launch file for JOINING an Internet game without NetAccolade.
; Copy to <game dir>\deadlock.ini, put the host's IP (VPN address recommended) in Master Address,
; start:  DEADLOCK.EXE -ms   and pick the host's session ("Online War") in the list that appears.
; [Scenario Options] and [World] must still be present and valid; the host's settings win.

[Meta]
File Type=new_game
Name=Online War

[Scenario Options]
Players=2
Victory Condition=conquest
Win Cities=5
Win Shrines=3
Win Turns=5
AI Skill Level=0
Random Events=true
Allow Alliances=true
Fast Production=false
World Resources=true
Last Player Timer=false
Last Player Clock=60
Auto Timer=false
Auto Timer Clock=60
Racial Abilities=standard_ability

[World]
Type=small

[Startup]
Role=slave
Master Address=192.168.1.10
User Name=Guest
Players=2
